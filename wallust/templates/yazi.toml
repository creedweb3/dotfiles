# yazi file manager colours (generated by wallust; edit the template, not ~/.config/yazi/theme.toml)
[mgr]
cwd = { fg = "{{color6}}" }
find_keyword  = { fg = "{{color4}}", bold = true, underline = true }
find_position = { fg = "{{color6}}", bg = "reset", bold = true }
marker_copied   = { fg = "{{color2}}", bg = "{{color2}}" }
marker_cut      = { fg = "{{color1}}", bg = "{{color1}}" }
marker_marked   = { fg = "{{color6}}", bg = "{{color6}}" }
marker_selected = { fg = "{{color4}}", bg = "{{color4}}" }
count_copied   = { fg = "{{background}}", bg = "{{color2}}" }
count_cut      = { fg = "{{background}}", bg = "{{color1}}" }
count_selected = { fg = "{{background}}", bg = "{{color4}}" }
border_symbol = "│"
border_style  = { fg = "{{color8}}" }

[tabs]
active   = { fg = "{{background}}", bg = "{{color4}}", bold = true }
inactive = { fg = "{{color7}}", bg = "{{color0}}" }

[mode]
normal_main = { fg = "{{background}}", bg = "{{color4}}", bold = true }
normal_alt  = { fg = "{{color4}}", bg = "{{color0}}" }
select_main = { fg = "{{background}}", bg = "{{color6}}", bold = true }
select_alt  = { fg = "{{color6}}", bg = "{{color0}}" }
unset_main  = { fg = "{{background}}", bg = "{{color1}}", bold = true }
unset_alt   = { fg = "{{color1}}", bg = "{{color0}}" }

[indicator]
parent  = { fg = "{{background}}", bg = "{{color7}}" }
current = { fg = "{{background}}", bg = "{{color4}}" }
preview = { underline = true }

[status]
perm_sep   = { fg = "{{color8}}" }
perm_type  = { fg = "{{color4}}" }
perm_read  = { fg = "{{color3}}" }
perm_write = { fg = "{{color1}}" }
perm_exec  = { fg = "{{color2}}" }
progress_label  = { fg = "{{foreground}}", bold = true }
progress_normal = { fg = "{{color4}}", bg = "{{color0}}" }
progress_error  = { fg = "{{color1}}", bg = "{{color0}}" }

[which]
border    = { fg = "{{color4}}" }
border_set = { as = "plain" }
cand      = { fg = "{{color6}}" }
rest      = { fg = "{{color8}}" }
desc      = { fg = "{{foreground}}" }
separator_style = { fg = "{{color8}}" }

[confirm]
border = { fg = "{{color4}}" }
border_set = { as = "plain" }
title  = { fg = "{{color4}}" }

[spot]
border = { fg = "{{color4}}" }
border_set = { as = "plain" }
title  = { fg = "{{color4}}" }

[notify]
border_set  = { as = "plain" }
title_info  = { fg = "{{color4}}" }
title_warn  = { fg = "{{color3}}" }
title_error = { fg = "{{color1}}" }

[pick]
border = { fg = "{{color4}}" }
border_set = { as = "plain" }
active = { fg = "{{color4}}", bold = true }

[input]
border = { fg = "{{color4}}" }
border_set = { as = "plain" }
selected = { fg = "{{background}}", bg = "{{color4}}" }

[cmp]
border = { fg = "{{color4}}" }
border_set = { as = "plain" }
active = { fg = "{{background}}", bg = "{{color4}}" }

[tasks]
border = { fg = "{{color4}}" }
border_set = { as = "plain" }
hovered = { fg = "{{color4}}", bold = true }

[help]
border = { fg = "{{color4}}" }
border_set = { as = "plain" }
chord   = { fg = "{{color6}}" }
hovered = { fg = "{{background}}", bg = "{{color4}}", bold = true }
