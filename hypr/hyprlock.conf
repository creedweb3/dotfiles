# hyprlock: the fallback lock screen (the rice normally locks with the Quickshell
# manga lock, quickshell/lock/; scripts/rice-lock picks). The demo's centre layout:
# the wallpaper blurred and darkened, the series symbol in the accent, weekday,
# time, date and a square password field outlined in the accent. No rounding, no glow.
#
# hyprlock still uses the hyprlang format (only Hyprland itself moved to Lua).
# colors.conf is written by wallust from the wallpaper; `wall` also links the
# wallpaper and renders the symbol as PNG (hyprlock can't read SVG).

source = ~/.config/hypr/colors.conf

$font = JetBrainsMono Nerd Font

# What the lock shows. Settings > Lock screen writes rice-lock.conf, which overrides these
# defaults; an empty $show_* hides that widget (see the if blocks below).
$show_sym = 1
$show_day = 1
$show_date = 1
$show_music =
$show_hint =
$day_text = cmd[update:60000] echo "<span letter_spacing='4096'>$(date +%A | tr '[:lower:]' '[:upper:]')</span>"
$date_text = cmd[update:60000] date +'%-d %B' | tr '[:upper:]' '[:lower:]'
source = ~/.config/hypr/rice-lock.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = soft, 0.3, 0, 0.2, 1
    animation = fadeIn, 1, 4, soft
    animation = fadeOut, 1, 3, soft
}

background {
    monitor =
    path = ~/.cache/rice/wallpaper
    color = $bg
    blur_passes = 3
    blur_size = 8
    brightness = 0.45
    vibrancy = 0.1
}

# hyprlang if show_sym
image {
    monitor =
    path = ~/.cache/rice/symbol.png
    size = 200
    rounding = 0
    border_size = 0
    position = 0, 250
    halign = center
    valign = center
}
# hyprlang endif

# Weekday: accent, upper case, spaced out (or kanji, from the settings).
# hyprlang if show_day
label {
    monitor =
    text = $day_text
    color = $acc
    font_size = 22
    font_family = $font
    position = 0, 115
    halign = center
    valign = center
}
# hyprlang endif

label {
    monitor =
    text = <b>$TIME</b>
    color = $fg
    font_size = 96
    font_family = $font
    position = 0, 40
    halign = center
    valign = center
}

# hyprlang if show_date
label {
    monitor =
    text = $date_text
    color = $dim
    font_size = 14
    font_family = $font
    position = 0, -35
    halign = center
    valign = center
}
# hyprlang endif

input-field {
    monitor =
    size = 312, 44
    outline_thickness = 2
    rounding = 0
    outer_color = $acc
    inner_color = rgba(0, 0, 0, 0.0)
    font_color = $acc
    font_family = $font
    check_color = $acc
    fail_color = $warn
    fail_text = $FAIL
    dots_center = false
    dots_size = 0.2
    dots_spacing = 0.5
    dots_rounding = -1
    fade_on_empty = false
    placeholder_text =
    position = 0, -110
    halign = center
    valign = center
}

# Unlock hint under the field.
# hyprlang if show_hint
label {
    monitor =
    text = type your password · enter unlocks
    color = $dim
    font_size = 11
    font_family = $font
    position = 0, -160
    halign = center
    valign = center
}
# hyprlang endif

# Now playing, at the bottom (only while something plays).
# hyprlang if show_music
label {
    monitor =
    text = cmd[update:2000] [ "$(playerctl status 2>/dev/null)" = Playing ] && printf '%s  ·  %s' "$(playerctl metadata title 2>/dev/null)" "$(playerctl metadata artist 2>/dev/null)" | tr '[:upper:]' '[:lower:]'
    color = $dim
    font_size = 12
    font_family = $font
    position = 0, 60
    halign = center
    valign = bottom
}
# hyprlang endif
