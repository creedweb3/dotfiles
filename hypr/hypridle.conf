# hypridle: dim at 4.5 min, lock at 5 min, screen off at 5.5 min, suspend at 30 min.
# Anything that locks (SUPER+L, sleep, `loginctl lock-session`) goes through lock_cmd.
#
# Settings > Power writes rice-idle.conf, which overrides these defaults (times in seconds);
# an empty $*_on turns that step off (see the if blocks below).
$dim_t = 270
$dim_on = 1
$lock_t = 300
$lock_on = 1
$off_t = 330
$off_on = 1
$sleep_t = 1800
$sleep_on = 1
source = ~/.config/hypr/rice-idle.conf

general {
    # rice-lock: the Quickshell manga lock, or hyprlock (Settings > Lock screen > lock with)
    lock_cmd = ~/.local/bin/rice-lock
    before_sleep_cmd = loginctl lock-session
    # wait for the lock to cover the screens before sleeping (the auto mode only knows hyprlock)
    inhibit_sleep = 3
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# hyprlang if dim_on
listener {
    timeout = $dim_t
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}
# hyprlang endif

# hyprlang if lock_on
listener {
    timeout = $lock_t
    on-timeout = loginctl lock-session
}
# hyprlang endif

# hyprlang if off_on
listener {
    timeout = $off_t
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r
}
# hyprlang endif

# hyprlang if sleep_on
listener {
    timeout = $sleep_t
    on-timeout = systemctl suspend
}
# hyprlang endif
