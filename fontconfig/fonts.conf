<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- JetBrains Mono everywhere: apps that ask for sans, serif or monospace get it.
     Noto covers scripts it lacks; Noto Color Emoji covers emoji. -->
<fontconfig>
  <alias><family>sans-serif</family><prefer><family>JetBrainsMono Nerd Font</family><family>Noto Sans</family><family>Noto Color Emoji</family></prefer></alias>
  <alias><family>serif</family><prefer><family>JetBrainsMono Nerd Font</family><family>Noto Serif</family><family>Noto Color Emoji</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>JetBrainsMono Nerd Font</family><family>Noto Sans Mono</family><family>Noto Color Emoji</family></prefer></alias>
</fontconfig>
