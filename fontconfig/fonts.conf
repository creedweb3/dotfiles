<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- JetBrains Mono everywhere: apps that ask for sans, serif or monospace get it.
     Noto covers scripts it lacks. For symbols JetBrains Mono lacks (⏮ ⏭ ♫ ↵ ☆ ❚ ...), the plain
     Noto Sans Symbols fonts come before Noto Color Emoji, so they draw as text-style symbols in the
     text's own colour instead of as colour emoji boxes. Noto Color Emoji still covers real emoji. -->
<fontconfig>
  <alias><family>sans-serif</family><prefer><family>JetBrainsMono Nerd Font</family><family>Noto Sans</family><family>Noto Sans Symbols 2</family><family>Noto Sans Symbols</family><family>Noto Color Emoji</family></prefer></alias>
  <alias><family>serif</family><prefer><family>JetBrainsMono Nerd Font</family><family>Noto Serif</family><family>Noto Sans Symbols 2</family><family>Noto Sans Symbols</family><family>Noto Color Emoji</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>JetBrainsMono Nerd Font</family><family>Noto Sans Mono</family><family>Noto Sans Symbols 2</family><family>Noto Sans Symbols</family><family>Noto Color Emoji</family></prefer></alias>
  <!-- apps (like the Quickshell shell) that ask for JetBrains Mono by name get the same fallback -->
  <alias><family>JetBrainsMono Nerd Font</family><accept><family>Noto Sans Symbols 2</family><family>Noto Sans Symbols</family></accept></alias>
</fontconfig>
