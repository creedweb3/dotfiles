# Quick panel > Deck: what each button runs (sh -c). install.sh copies this to
# ~/.config/rice/deck.conf once and never overwrites it, so edit that copy freely.
#   key: command      runs on a press
#   key?: command     toggles only: exit status 0 means "on" (checked every 2 s while the panel is open)
# Keys: shot rec pick term files web mic game clip emoji calc cup. A key with no line shows greyed out.

shot: grim -g "$(slurp)" - | wl-copy && notify-send screenshot "area copied to clipboard"

rec: if pidof wf-recorder >/dev/null; then pkill -INT -x wf-recorder; notify-send record "saved to ~/Videos"; else g=$(slurp) || exit; mkdir -p ~/Videos; exec wf-recorder -g "$g" -f ~/Videos/rec-$(date +%Y%m%d-%H%M%S).mp4; fi
rec?: pidof wf-recorder

pick: c=$(hyprpicker -a) && [ -n "$c" ] && notify-send "colour picker" "copied $c"

term: kitty
files: kitty -e yazi
web: brave

mic: wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
mic?: wpctl get-volume @DEFAULT_AUDIO_SOURCE@ | grep -q MUTED

# Game mode: no animations and no blur. The flag file only remembers the state until logout.
game: f="$XDG_RUNTIME_DIR/rice-game"; if [ -e "$f" ]; then rm -f "$f"; v=true; else touch "$f"; v=false; fi; hyprctl eval "hl.config({ animations = { enabled = $v }, decoration = { blur = { enabled = $v } } })"
game?: [ -e "$XDG_RUNTIME_DIR/rice-game" ]

clip: cliphist list | rofi -dmenu -i -p clipboard | cliphist decode | wl-copy
emoji: sed -n 's/.*; fully-qualified *# \([^ ]*\) E[0-9.]* \(.*\)/\1 \2/p' /usr/share/unicode/emoji/emoji-test.txt | rofi -dmenu -i -p emoji | cut -d' ' -f1 | tr -d '\n' | wl-copy
# The launcher, opened in calculator mode.
calc: qs -c rice ipc call launcher open calc

# Stay awake: stop hypridle (no dimming, locking or sleep); press again to start it.
cup: if pidof hypridle >/dev/null; then pkill -x hypridle; else setsid -f hypridle >/dev/null 2>&1; fi
cup?: ! pidof hypridle >/dev/null
