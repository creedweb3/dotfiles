# Optional apps, offered in the installer's menu or picked with --apps=id,id.
# Columns are separated by |; spaces around them are ignored.
#   id        what --apps uses
#   source    pacman (official repos) or aur (installed with yay)
#   package   the package name
#   category  shown as a column in the menu
#   name      shown in the menu and the summary
#   about     a few words shown in the menu
#
# id          | source | package                | category | name        | about
brave         | aur    | brave-bin              | browser  | Brave       | default browser (SUPER+B)
vesktop       | aur    | vesktop-bin            | chat     | Vesktop     | Discord, themed
spotify       | pacman | spotify-launcher       | music    | Spotify     | music streaming
spicetify     | aur    | spicetify-cli          | music    | Spicetify   | themes Spotify
tidal         | aur    | tidal-hifi-bin         | music    | Tidal       | hi-fi streaming
vscode        | aur    | visual-studio-code-bin | dev      | VS Code     | code editor
claude        | aur    | claude-desktop         | dev      | Claude      | desktop app
claude-code   | aur    | claude-code            | dev      | Claude Code | terminal agent
steam         | pacman | steam                  | gaming   | Steam       | needs multilib
qbittorrent   | pacman | qbittorrent            | tools    | qBittorrent | torrents
vlc           | pacman | vlc                    | tools    | VLC         | media player
7zip          | pacman | 7zip                   | tools    | 7-Zip       | archives
